<div class="flex flex-col h-full w-full max-w-full overflow-hidden p-6 gap-4">
    <!-- Top Toolbar -->
    <header
        class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl p-3 px-4 flex items-center justify-between gap-3 shadow-sm transition-colors duration-300 overflow-x-auto custom-scrollbar">
        <div class="flex items-center gap-2 flex-shrink-0">
            <!-- Search Box -->
            <div class="relative flex items-center">
                <span
                    class="material-symbols-outlined absolute left-3 text-gray-400 dark:text-gray-500 text-[18px]">search</span>
                <input type="text" id="search-input" placeholder="Search bean..."
                    class="pl-9 pr-3 py-1 bg-gray-50 dark:bg-slate-950 border border-gray-200 dark:border-slate-800 text-gray-800 dark:text-gray-100 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all w-36 focus:w-52" />
                <div id="search-suggestions"
                    class="absolute left-0 right-0 top-full mt-1 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-lg shadow-lg max-h-60 overflow-y-auto z-50 text-xs hidden">
                </div>
            </div>

            <!-- Collapse Button -->
            <button
                class="flex items-center gap-1 px-2.5 py-1 border border-gray-200 dark:border-slate-700 rounded-lg text-xs font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-slate-900 hover:bg-gray-50 dark:hover:bg-slate-800 shadow-sm transition-all cursor-pointer whitespace-nowrap"
                id="btn-collapse" title="Collapse All">
                <span class="material-symbols-outlined text-[16px]">zoom_out</span> Collapse All
            </button>

            <!-- Reset Button -->
            <button
                class="flex items-center gap-1 px-2.5 py-1 border border-gray-200 dark:border-slate-700 rounded-lg text-xs font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-slate-900 hover:bg-gray-50 dark:hover:bg-slate-800 shadow-sm transition-all cursor-pointer whitespace-nowrap"
                id="btn-reset" title="Reset View">
                <span class="material-symbols-outlined text-[16px]">center_focus_strong</span> Reset
            </button>

            <!-- Layout Toggle group -->
            <div
                class="flex items-center border border-gray-200 dark:border-slate-800 rounded-lg bg-gray-50 dark:bg-slate-950 p-0.5 whitespace-nowrap">
                <button
                    class="px-2 py-1 text-xs font-semibold rounded-md transition-all cursor-pointer flex items-center gap-1 bg-white dark:bg-slate-900 text-gray-800 dark:text-white shadow-sm"
                    id="btn-tb" title="Top → Bottom">
                    <span class="material-symbols-outlined text-[16px]">south</span> Top → Bottom
                </button>
                <button
                    class="px-2 py-1 text-xs font-semibold rounded-md transition-all cursor-pointer flex items-center gap-1 text-gray-500 dark:text-gray-400 hover:text-gray-850 dark:hover:text-white"
                    id="btn-lr" title="Left → Right">
                    <span class="material-symbols-outlined text-[16px]">east</span> Left → Right
                </button>
            </div>

            <!-- Highlight Path Button -->
            <button
                class="flex items-center gap-1 px-2.5 py-1 border border-gray-200 dark:border-slate-700 rounded-lg text-xs font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-slate-900 hover:bg-gray-50 dark:hover:bg-slate-800 shadow-sm transition-all cursor-pointer whitespace-nowrap"
                id="btn-highlight-path" title="Toggle Path Highlighting">
                <span class="material-symbols-outlined text-[16px]">insights</span> Highlight Path
            </button>
        </div>

        <!-- Toolbar Right Statuses -->
        <div class="flex items-center gap-2 text-xs font-medium text-gray-600 flex-shrink-0 whitespace-nowrap">
            <!-- Chunk Loading Progress Badge -->
            <div id="chunk-progress-badge"
                class="flex items-center gap-1.5 bg-amber-50 dark:bg-amber-950/20 text-amber-700 dark:text-amber-300 px-2.5 py-1 rounded-full border border-amber-200 dark:border-amber-900/30 transition-all">
                <span id="chunk-progress-dot" class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                <span>Loading: <strong id="chunk-progress-text" class="font-bold">0 / 0</strong></span>
            </div>

            <!-- Manual Reload / Retry Button -->
            <button id="btn-reload-graph"
                class="flex items-center gap-1 px-2.5 py-1 bg-white dark:bg-slate-900 text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white border border-gray-200 dark:border-slate-700 rounded-full shadow-sm hover:bg-gray-50 dark:hover:bg-slate-800 transition-all cursor-pointer"
                title="Reload / Retry Data">
                <span class="material-symbols-outlined text-[15px]">refresh</span>
                <span>Reload</span>
            </button>

            <!-- Beans Count -->
            <div
                class="flex items-center gap-1.5 bg-blue-50 dark:bg-blue-950/20 text-blue-700 dark:text-blue-300 px-2.5 py-1 rounded-full border border-blue-100 dark:border-blue-900/30">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-none"></span>
                <span>Beans: <strong id="beans-count" class="font-bold">0</strong></span>
            </div>

            <!-- Dependencies Count -->
            <div
                class="flex items-center gap-1.5 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 px-2.5 py-1 rounded-full border border-gray-200 dark:border-slate-700">
                <span class="w-1.5 h-1.5 rounded-full bg-gray-400 dark:bg-slate-500 animate-none"></span>
                <span>Dependencies: <strong id="deps-count" class="font-bold">0</strong></span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main
        class="relative flex-1 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl overflow-hidden shadow-sm min-h-[500px] transition-colors duration-300">
        <!-- Main Graph Area -->
        <div id="beanGraph" class="w-full h-full min-h-[500px]">
            <svg id="tree-svg" class="w-full h-full min-h-[500px]"></svg>
        </div>

        <!-- Navigation Controls floating in bottom-left -->
        <div
            class="absolute bottom-4 left-4 flex flex-col gap-1 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-lg p-1.5 shadow-md z-10">
            <button
                class="w-8 h-8 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-slate-800 rounded-md transition-colors cursor-pointer"
                id="btn-pan-mode" title="Fit View">
                <span class="material-symbols-outlined text-[18px]">fit_screen</span>
            </button>
            <button
                class="w-8 h-8 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-slate-800 rounded-md transition-colors cursor-pointer"
                id="btn-control-zoom-in" title="Zoom In">
                <span class="material-symbols-outlined text-[18px]">add</span>
            </button>
            <button
                class="w-8 h-8 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-slate-800 rounded-md transition-colors cursor-pointer"
                id="btn-control-zoom-out" title="Zoom Out">
                <span class="material-symbols-outlined text-[18px]">remove</span>
            </button>
            <button
                class="w-8 h-8 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-slate-800 rounded-md transition-colors cursor-pointer"
                id="btn-control-fit" title="Toggle Fullscreen">
                <span class="material-symbols-outlined text-[18px]">aspect_ratio</span>
            </button>
        </div>

        <!-- Legend Panel in bottom-right -->
        <div
            class="absolute bottom-4 right-4 bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm border border-gray-200 dark:border-slate-800 rounded-xl p-3 shadow-md z-10 flex flex-col gap-2 text-[11px] text-gray-600 dark:text-gray-450 w-36">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-none"></span>
                <span>Root Bean</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-none"></span>
                <span>Intermediate</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-none"></span>
                <span>Leaf Bean</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-purple-500 animate-none"></span>
                <span>Adapter Bean</span>
            </div>
        </div>

        <!-- Details Sidebar on the Right -->
        <aside
            class="absolute top-0 right-0 bottom-0 w-80 bg-white dark:bg-slate-900 border-l border-gray-200 dark:border-slate-800 shadow-xl z-20 flex flex-col transition-colors duration-300"
            id="details-sidebar" style="display: none;">
            <!-- Header -->
            <div class="p-4 border-b border-gray-100 dark:border-slate-800 flex items-center justify-between">
                <h3 class="font-bold text-sm text-gray-800 dark:text-white">Bean Details</h3>
                <button
                    class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 transition-colors cursor-pointer flex items-center"
                    id="btn-close-sidebar">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>

            <!-- Content -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                <div class="pb-3 border-b border-gray-50 dark:border-slate-800">
                    <div
                        class="text-[10px] text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wider mb-1">
                        Name</div>
                    <div class="text-xs font-bold text-gray-800 dark:text-gray-200 break-all font-mono"
                        id="detail-bean-name">-</div>
                </div>
                <div class="pb-3 border-b border-gray-50 dark:border-slate-800">
                    <div
                        class="text-[10px] text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wider mb-1">
                        Type</div>
                    <div class="text-xs font-medium text-gray-600 dark:text-gray-400 break-all font-mono"
                        id="detail-bean-type">-</div>
                </div>
                <div class="pb-3 border-b border-gray-50 dark:border-slate-800">
                    <div
                        class="text-[10px] text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wider mb-1">
                        Scope</div>
                    <span
                        class="px-2.5 py-0.5 rounded-full text-[10px] font-bold inline-block border border-gray-200 dark:border-slate-800"
                        id="detail-bean-scope">-</span>
                </div>

                <!-- Dependencies Accordion -->
                <div class="border border-gray-200 dark:border-slate-800 rounded-lg overflow-hidden">
                    <div class="accordion-header w-full px-3 py-2 bg-gray-50 dark:bg-slate-800/40 flex items-center justify-between text-xs font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-800/70 transition-colors cursor-pointer"
                        id="accordion-deps-header">
                        <span>Dependencies (<span id="detail-deps-count">0</span>)</span>
                        <span
                            class="material-symbols-outlined text-[18px] transition-transform duration-200">chevron_right</span>
                    </div>
                    <div class="accordion-body p-2 max-h-48 overflow-y-auto custom-scrollbar bg-white dark:bg-slate-900 divide-y divide-gray-50 dark:divide-slate-800 text-[11px]"
                        id="accordion-deps-body" style="display: none;">
                        <!-- List of dependencies will go here dynamically -->
                    </div>
                </div>

                <!-- Dependents Accordion -->
                <div class="border border-gray-200 dark:border-slate-800 rounded-lg overflow-hidden">
                    <div class="accordion-header w-full px-3 py-2 bg-gray-50 dark:bg-slate-800/40 flex items-center justify-between text-xs font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-800/70 transition-colors cursor-pointer"
                        id="accordion-dependents-header">
                        <span>Dependents (<span id="detail-dependents-count">0</span>)</span>
                        <span
                            class="material-symbols-outlined text-[18px] transition-transform duration-200">chevron_right</span>
                    </div>
                    <div class="accordion-body p-2 max-h-48 overflow-y-auto custom-scrollbar bg-white dark:bg-slate-900 divide-y divide-gray-50 dark:divide-slate-800 text-[11px]"
                        id="accordion-dependents-body" style="display: none;">
                        <!-- List of dependents will go here dynamically -->
                    </div>
                </div>
            </div>
        </aside>
    </main>
</div>
